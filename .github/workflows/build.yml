name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build Wallpaper Manager APK
        working-directory: wallpaper-manager
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp launcher/app/build/outputs/apk/release/app-release.apk release-apks/SimplTvOS-Launcher.apk
          cp wallpaper-manager/app/build/outputs/apk/release/app-release.apk release-apks/SimplTvOS-WallpaperManager.apk

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimplTvOS-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          body: |
            ## 📥 Download & Install

            1. Download **SimplTvOS-Launcher.apk** and **SimplTvOS-WallpaperManager.apk** below
            2. Enable **USB Debugging** on your Android TV (Settings → About → tap Build Number 7 times → Developer Options → USB Debugging)
            3. Connect via ADB: `adb connect <your-tv-ip>:5555`
            4. Install: `adb install SimplTvOS-Launcher.apk` and `adb install SimplTvOS-WallpaperManager.apk`
            5. Set as Home: Press Home and select **SimplTvOS** as default launcher

            See the [README](https://github.com/${{ github.repository }}#installation) for full instructions.
